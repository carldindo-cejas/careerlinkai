name = "careerlinkai"
main = "src/index.ts"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]

# --- The frontend, served by this same Worker (single-deployment architecture) ---------
# `wrangler deploy` builds `../frontend` first (see [build] below) and uploads `dist/` to
# Cloudflare's static-asset store. There is no second deployment and no Cloudflare Pages
# project any more: careerlinkai.online resolves to this Worker script, which answers both
# the SPA and the API from one origin.
#
# ── The three lines that make this work, and why each is load-bearing ──────────────────
#
# `directory` — the Vite build output, referenced in place. The frontend is not copied into
# the backend; the two packages keep their own trees, their own package.json and their own
# test suites exactly as before. Assets are stored separately from the Worker script and do
# **not** count against the Free plan's 3 MB gzipped bundle cap (`npm run gate:bundle`
# measures the script only), which is what lets an 11 MB `dist/` — pdf.worker.mjs and the
# artwork — ship on the same free deploy as the API.
#
# `not_found_handling` — a request that matches no asset gets `/index.html` with **200**,
# so React Router owns /login, /student/assessments, and every other path that is not a
# file. This replaces the Pages `_redirects` rule (`/* /index.html 200`), which was deleted:
# Workers static assets do not implement 200-status rewrites in `_redirects`, so keeping
# that file would have silently done nothing and every hard refresh would 404.
#
# `run_worker_first` — **the one line this whole design turns on.** `not_found_handling`
# runs *before* the Worker, so with SPA fallback alone a browser navigation to
# /api/v1/health returns the HTML shell instead of JSON, and the API is unreachable from the
# address bar (a client-side `fetch()` would still work, which is what makes this failure so
# easy to ship — the app looks fine and only direct hits, curl, and the health check break).
# Listing /api/* here forces those paths to the Worker before the asset router sees them.
# Everything else keeps the default asset-first path, so a hashed JS chunk is served from the
# edge without ever invoking — or billing — the Worker.
#
# The whole API lives under the §17 `/api/v1` mount, so this single pattern covers /auth,
# /ai, /admin, /counselor, /student and the rest; they are `/api/v1/auth`, `/api/v1/ai`, …
# not top-level paths.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# `wrangler deploy` and nothing else (the stated deployment contract). Wrangler runs this
# custom build before it bundles, so the `dist/` that `[assets]` points at is always the one
# built from the commit being deployed — never a stale local artifact, which is the classic
# way a "successful" deploy ships last week's frontend.
#
# `SKIP_FRONTEND_BUILD=1` short-circuits it for `wrangler deploy --dry-run` in the bundle
# gate, where CI has backend dependencies only and the frontend is built and tested by its
# own job. See scripts/build-frontend.mjs.
[build]
command = "node scripts/build-frontend.mjs"

# --- CPU budget (§38, §45 v1.5) --------------------------------------------------------
# There is NO [limits] block in this file, permanently, and the platform gate
# (scripts/platform-gates.mjs) fails the build if one appears: the Free plan is a ratified
# product requirement (FULLPLAN v1.5) and a free deploy *rejects* the block outright —
# "CPU limits are not supported for the Free plan. [code: 100328]".
#
# §38's password hashing does not fit in a free Worker's 10 ms CPU budget — that is the
# story of deviation D14, found on the Step 5 staging deploy when 600,000 PBKDF2 iterations
# killed /auth/change-password with error 1102 (reported by the browser as a CORS failure,
# because a Worker killed mid-request emits no headers at all). The fix is not a paid plan:
# a **Durable Object gets the standard 30-second CPU budget per invocation on every plan,
# including Free**, so the derivation lives in AuthGuardDO (Phase 4.5) at the full 600,000
# iterations, and the Worker only ever forwards hash/verify calls to the stub.

# Custom domains (careerlinkai.online, www.careerlinkai.online) are already
# attached to this Worker script name via Cloudflare Workers Custom Domains
# (dashboard-managed, not declared here).

# --- Vars (FULLPLAN §48 — committed, non-secret) -------------------------------------
# Every *Cloudflare* service is reached through a binding, not a credential — that is still true of
# D1, R2, KV, Vectorize, Workers AI, Queues and the Durable Object, and it is why nothing below is
# sensitive.
#
# **It is no longer true that the system has no secrets at all** (P4-2). Transactional email goes
# through Resend, which is external to Cloudflare and authenticates with an API key, so
# `RESEND_API_KEY` exists as a Worker secret — set with `wrangler secret put`, never written here.
# Cloudflare's own Email Sending would have avoided the credential and was rejected for it: sending
# to arbitrary recipients requires Workers Paid, and the Free plan is ratified (§45). The exact
# trade was one secret against one paid plan, and the secret won.
#
# This paragraph is maintained rather than deleted because the previous version of it stated the
# stronger claim as a flat fact, and P3-1 is the record of what happens when a document keeps
# asserting something that has quietly stopped being true.
[vars]
APP_ENV = "local"
FRONTEND_URL = "http://localhost:5173"
# P4-2. The sending domain is not the serving domain: staging is served from a workers.dev
# subdomain, which Resend cannot verify, so every scope sends from the one verified domain —
# and Resend's free tier allows exactly one, which makes that a constraint rather than a choice.
# Local sets no RESEND_API_KEY, so this value is inert there.
EMAIL_FROM = "no-reply@careerlinkai.online"
# -fp8, not the base model: `@cf/meta/llama-3.1-8b-instruct` was deprecated by Cloudflare on
# 2026-05-30 and every call to it fails with error 5028 — found live on the Phase 5a staging
# exit demo (a model retirement happens server-side, with no deploy on our end; the gateway
# logged FAILED ai_requests rows and every student saw the deterministic §27 reason, exactly
# the §29 posture). If explanations ever degrade to MODEL_ERROR again, check the model's
# lifecycle page before suspecting the code.
WORKERS_AI_TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
WORKERS_AI_EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
STUDENT_JOIN_CODE_TTL_DAYS = "90"
STUDENT_TOKEN_TTL_HOURS = "12"
STAFF_TOKEN_TTL_HOURS = "168"
ASSESSMENT_GENERATION_MAX_QUESTIONS = "50"
# Audit S2 / plan P3-4 — the coarse per-user request budget, in requests per minute, charged
# in authenticate() against a per-user AuthGuardDO counter. A capacity number, not a security
# rule, which is why it is a var: 300/min is far above any human workflow (the heaviest is a
# student answering a 60-item instrument, one POST per answer, and nobody answers five per
# second) and far below what a scripted loop can spend of the Free plan's 100k/day.
API_RATE_LIMIT_PER_MINUTE = "300"

# --- Bindings (FULLPLAN §48) ---------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "CareerLinkAI_Main"
database_id = "a3d20b3b-d9dd-435c-b6a7-2eb85e746942"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "careerlinkai-docs"

[[vectorize]]
binding = "VECTORIZE"
index_name = "careerlinkai_main_knowledge"

[ai]
binding = "AI"

# v1.5: **caching only.** The rate-limit counters and staff lockouts that used to live here
# moved into AuthGuardDO (Phase 4.5, deviation D19) — KV is eventually consistent, allows
# 1 write/s/key, and the Free plan caps it at 1,000 writes/day account-wide, which
# disqualifies it as a security counter (§38, §45). Nothing security-relevant reads or
# writes this namespace any more; it stays bound for future caching.
[[kv_namespaces]]
binding = "KV"
id = "2c31fc74fb2b40c59e7c0dda8884a848"

# There is deliberately **no [[send_email]] binding** here (P4-2). Transactional email goes to
# Resend over HTTPS with `RESEND_API_KEY`, not through Cloudflare Email Sending — see the [vars]
# note above for why the credential was preferred to the paid plan that binding would have needed.
# Adding one later would create a second delivery path that nothing exercises.

# AuthGuardDO (§38 v1.5, Phase 4.5): password derivation at the full 600,000 iterations —
# the DO gets a 30 s CPU budget per invocation on every plan, vs the free Worker's 10 ms —
# plus the strongly-consistent, failures-only lockout and join-throttle counters. One
# instance per staff email; one per (class_code, IP) pair. SQLite-backed (the only kind the
# Free plan allows), declared in [[migrations]] at the bottom of this file.
[[durable_objects.bindings]]
name = "AUTH_DO"
class_name = "AuthGuardDO"

# Two logical queues (§42): `default` for notifications/light work, `ai` for anything that
# calls Workers AI or does heavy text processing, so an AI burst never starves a
# notification. Both exist in the account as of Step 5.
[[queues.producers]]
binding = "QUEUE_DEFAULT"
queue = "careerlinkai-default-queue"

[[queues.producers]]
binding = "QUEUE_AI"
queue = "careerlinkai-ai-queue"

[[queues.consumers]]
queue = "careerlinkai-default-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
# H1: after 3 retries a message is dead-lettered here instead of dropped. Free tier includes DLQs.
dead_letter_queue = "careerlinkai-default-dlq"

[[queues.consumers]]
queue = "careerlinkai-ai-queue"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "careerlinkai-ai-dlq"

# The DLQs are consumed by this same Worker (see the `queue` handler in src/index.ts): a
# dead-lettered job is logged and marked FAILED where possible, then acked — never silently lost.
[[queues.consumers]]
queue = "careerlinkai-default-dlq"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "careerlinkai-ai-dlq"
max_batch_size = 10
max_batch_timeout = 30

# --- Observability & Cron (audit H / M11) --------------------------------------------
# Workers Logs, free tier: without it the correlation-id design has nowhere to persist, so a
# production incident has no trail. Declared per-scope (environments inherit nothing).
[observability]
enabled = true

# Nightly housekeeping at 03:00 UTC — see the `scheduled` handler in src/index.ts. Cron Triggers
# are free. Idempotent, so the exact minute and a missed run are both immaterial.
[triggers]
crons = ["0 3 * * *"]

# --- Environments (FULLPLAN §45) -----------------------------------------------------
# Staging and production are two Wrangler environments of the same Worker. Wrangler
# environments do not inherit top-level bindings, so each block is self-contained — a
# binding omitted below is simply absent at runtime, and `env.DB` would be `undefined`
# rather than a deploy-time error.
#
# Staging's resources were provisioned in Phase 3.5 Step 5 and are its *own*: a separate D1
# database, KV namespace, R2 bucket, Vectorize index and queue pair. Staging must never be
# able to write to production's data — that is the whole point of having it.
#
# `wrangler deploy --env staging` publishes the script as `careerlinkai-staging`, which is a
# different Worker from `careerlinkai` (production, and the script the careerlinkai.online
# custom domains are attached to). Deploying staging cannot touch the live site.

[env.staging.vars]
APP_ENV = "staging"
# The origin that serves the app — which, since the consolidation, is **this Worker itself**.
# It was `https://careerlinkai-staging.pages.dev`, the separate Pages deployment that no longer
# exists.
#
# The frontend no longer reads this value in any form: it calls the relative path `/api/v1`, so
# it is same-origin by construction and cannot be pointed at the wrong backend. What still reads
# it is §41's CORS allow-list in app.ts, which now describes a case that no longer arises in
# normal operation — a same-origin request is not subject to CORS at all. It stays exact rather
# than becoming a wildcard, so that if anything ever *does* call this API cross-origin, the
# answer is a deliberate one origin rather than "anyone".
FRONTEND_URL = "https://careerlinkai-staging.cejascarldindo.workers.dev"
# P4-2 — see the top-level [vars] note. Staging mails from the production domain because it is the
# only verified one; the link inside still points at FRONTEND_URL above, so a staging reset cannot
# walk a user onto production.
EMAIL_FROM = "no-reply@careerlinkai.online"
WORKERS_AI_TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
WORKERS_AI_EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
STUDENT_JOIN_CODE_TTL_DAYS = "90"
STUDENT_TOKEN_TTL_HOURS = "12"
STAFF_TOKEN_TTL_HOURS = "168"
ASSESSMENT_GENERATION_MAX_QUESTIONS = "50"
# The S2 request budget — see the top-level [vars] block for what the number means.
API_RATE_LIMIT_PER_MINUTE = "300"

# Declared per environment rather than inherited, exactly like every binding in this file.
# Wrangler's docs do not state whether `assets` is an inheritable key; an omission that turned
# out to be inherited costs nothing, and one that turned out *not* to be would deploy a Worker
# with no frontend at all. Explicit is the cheap side of that bet.
[env.staging.assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "CareerLinkAI_Staging"
database_id = "54401a5c-bd05-4d38-973d-26e4b2b38f9f"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "careerlinkai-docs-staging"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "careerlinkai_staging_knowledge"

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "c1b7d6bbe3dc43b68cd3dd28368b5a60"

# Environments inherit no bindings (a missing one is a runtime `undefined`, not a deploy
# error), so AUTH_DO is declared per environment — the platform gate asserts it.
[[env.staging.durable_objects.bindings]]
name = "AUTH_DO"
class_name = "AuthGuardDO"

[[env.staging.queues.producers]]
binding = "QUEUE_DEFAULT"
queue = "careerlinkai-staging-default-queue"

[[env.staging.queues.producers]]
binding = "QUEUE_AI"
queue = "careerlinkai-staging-ai-queue"

[[env.staging.queues.consumers]]
queue = "careerlinkai-staging-default-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "careerlinkai-staging-default-dlq"

[[env.staging.queues.consumers]]
queue = "careerlinkai-staging-ai-queue"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "careerlinkai-staging-ai-dlq"

[[env.staging.queues.consumers]]
queue = "careerlinkai-staging-default-dlq"
max_batch_size = 10
max_batch_timeout = 30

[[env.staging.queues.consumers]]
queue = "careerlinkai-staging-ai-dlq"
max_batch_size = 10
max_batch_timeout = 30

[env.staging.observability]
enabled = true

[env.staging.triggers]
crons = ["0 3 * * *"]

# --- Production is `careerlinkai-production`, and the domains are declared here ---------
# Wrangler derives an environment's script name as `<name>-<env>`: `--env staging` publishes
# `careerlinkai-staging` (which staging has always been) and `--env production` publishes
# **`careerlinkai-production`**. That derivation is left alone.
#
# It did not used to match reality. `careerlinkai.online` and `www` were attached to the bare
# `careerlinkai` script back when production was a plain `wrangler deploy` with no
# environments, and three documents in this repo then recorded
# "careerlinkai.online → careerlinkai (env.production)" as though the two were one script.
# They never were. Nothing caught it because `--env production` had never been run: the P3-1
# cutover was the first time, and it published a Worker no domain pointed at while the domain
# kept serving the April build. Step 8's health check is what found it — the step that exists
# for exactly that.
#
# Overwriting the legacy script in place was tried first and **refused by Cloudflare**: it
# holds live `NotificationDO` Durable Objects, a class that exists in no committed config and
# nowhere in the current codebase, so its migration-tag state is not derivable from this
# repository. Moving the domains to the environment Wrangler already names is the fix that
# does not require destroying Durable Object data to work around a naming mismatch.
#
# `custom_domain = true` puts the attachment **in this file** rather than only in the
# dashboard, so which script answers careerlinkai.online is now a reviewable fact.
#
# The legacy `careerlinkai` script is deliberately left deployed and domain-less as a
# rollback target. It is dead code on the Free plan's script count and nothing routes to it.
#
# ⚠️ Note the footgun this configuration does NOT have, since it is the reason the override
# was rejected: `wrangler deploy` with no `--env` targets `careerlinkai` using the *top-level*
# `[vars]` block, which says `APP_ENV = "local"` against production's D1, R2, KV and queues.
# Because no domain resolves to that script any more, such a deploy cannot reach a student.
[[env.production.routes]]
pattern = "careerlinkai.online"
custom_domain = true

[[env.production.routes]]
pattern = "www.careerlinkai.online"
custom_domain = true

[env.production.vars]
APP_ENV = "production"
# Unchanged in value, but it now means something different: careerlinkai.online is the origin
# of *this Worker*, not of a separate Pages site that talked to it. See the staging note above.
FRONTEND_URL = "https://careerlinkai.online"
# P4-2 — see the top-level [vars] note.
EMAIL_FROM = "no-reply@careerlinkai.online"
WORKERS_AI_TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
WORKERS_AI_EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
STUDENT_JOIN_CODE_TTL_DAYS = "90"
STUDENT_TOKEN_TTL_HOURS = "12"
STAFF_TOKEN_TTL_HOURS = "168"
ASSESSMENT_GENERATION_MAX_QUESTIONS = "50"
# The S2 request budget — see the top-level [vars] block for what the number means.
API_RATE_LIMIT_PER_MINUTE = "300"

[env.production.assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "CareerLinkAI_Main"
database_id = "a3d20b3b-d9dd-435c-b6a7-2eb85e746942"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "careerlinkai-docs"

[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "careerlinkai_main_knowledge"

[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "KV"
id = "2c31fc74fb2b40c59e7c0dda8884a848"

[[env.production.durable_objects.bindings]]
name = "AUTH_DO"
class_name = "AuthGuardDO"

[[env.production.queues.producers]]
binding = "QUEUE_DEFAULT"
queue = "careerlinkai-default-queue"

[[env.production.queues.producers]]
binding = "QUEUE_AI"
queue = "careerlinkai-ai-queue"

[[env.production.queues.consumers]]
queue = "careerlinkai-default-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "careerlinkai-default-dlq"

[[env.production.queues.consumers]]
queue = "careerlinkai-ai-queue"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "careerlinkai-ai-dlq"

[[env.production.queues.consumers]]
queue = "careerlinkai-default-dlq"
max_batch_size = 10
max_batch_timeout = 30

[[env.production.queues.consumers]]
queue = "careerlinkai-ai-dlq"
max_batch_size = 10
max_batch_timeout = 30

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["0 3 * * *"]

# --- Durable Object migrations --------------------------------------------------------
# Top-level and shared by every environment (unlike bindings, migrations ARE inherited —
# they describe the *class*, not a per-environment resource). `new_sqlite_classes`, not
# `new_classes`: SQLite-backed instances are the only kind the Free plan allows, and the
# recommended kind anyway.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthGuardDO"]
