# Nightly verified backup of the production D1 database (IMPLEMENTATION-PLAN P3-5 follow-up).
#
# `BACKUP-AND-RECOVERY.md` and PRODUCTION_REQUIREMENTS.md both say to put the daily job on a
# schedule "the same day" production goes live. Production went live on 2026-07-30 and this is that
# job. Until it existed the RPO was "everything since the last time someone remembered", and the
# only backup in existence was the one taken by hand during the cutover.
#
# ── What this covers that Time Travel does not ────────────────────────────────────────────────
#
# D1's Time Travel gives 30 days of point-in-time restore on every plan with nothing to configure,
# and it covers the common disasters — a bad migration, a DELETE without a WHERE. It cannot cover
# the two that are final, because it lives *inside* the database it protects: the database being
# deleted, and the Cloudflare account being lost.
#
# So the artifact is deliberately stored on **GitHub, not Cloudflare**. A backup of a Cloudflare
# database held in a Cloudflare bucket shares a blast radius with the thing it is insuring, and R2
# would also be reachable by the same API token this workflow already holds.
#
# Retention is 90 days, deliberately **longer** than Time Travel's 30: inside 30 days Time Travel is
# the better tool (in-place, no window where the data is absent, per `d1-restore.mjs`'s own guard),
# so the only job these files have is to exist after that window closes.
#
# ── Why it runs the repo's script and not `wrangler d1 export` ────────────────────────────────
#
# `wrangler d1 export` exits 0 on an empty database. `scripts/d1-backup.mjs` reads the live table
# list and per-table COUNT(*), parses the dump it just wrote, and asserts they agree table by table
# and row by row — writing `.REJECTED` and failing rather than keeping a dump it could not verify.
# A backup nobody verified is a hypothesis, and the failure mode is silent until the restore.
#
# ── Setup required before this can run ────────────────────────────────────────────────────────
#
# One repository secret: `CLOUDFLARE_API_TOKEN`, a token with **D1:Edit** and **Account
# Settings:Read** on the account that owns `CareerLinkAI_Main`. Create it at
# dash.cloudflare.com → My Profile → API Tokens → Create Token → Custom token.
#
# **It says Edit, and that is not what this file said first.** The original instruction was
# D1:Read, on the reasoning that this job never writes to D1 and an unattended nightly holding a
# write-capable production credential is a standing risk for no benefit. The reasoning was sound
# and the platform does not appear to permit it: both calls this job makes are POSTs — `d1 execute
# --command "SELECT …"` hits `/query`, which the API cannot statically prove is a read, and
# `d1 export` hits `/export`. Cloudflare's own import/export tutorial specifies Edit, and their
# release notes record D1:Read having been able to write as a *bug that was fixed*, so a token that
# once worked may have stopped.
#
# `CLOUDFLARE_ACCOUNT_ID` must be the account id from `wrangler whoami`. It is not optional-ish:
# **a wrong value is worse than an absent one**, because with the secret unset a single-account
# token resolves its own account, while a wrong value is faithfully pasted into the request URL.
#
# ── What the first four runs actually cost, recorded because the order matters ─────────────────
#
# Two separate faults were stacked, and the first one masked the second:
#
#   1. `CLOUDFLARE_ACCOUNT_ID` was wrong. Every request 404'd at the router with
#      `Could not route to /client/v4/accounts/***/d1/database/…/query, perhaps your object
#      identifier is invalid? [code: 7003]` — which is not an auth error and never reached a
#      permission check.
#   2. With the account id corrected, the same call returned `Authentication error [code: 10000]`.
#      Only then was the token the live problem.
#
# The lesson is about diagnosis, not about Cloudflare. The first failure was read as a permission
# problem *because a permission problem was the plausible story* — the workflow's own header said
# D1:Read, Cloudflare's docs say Edit, and the run went red. The log said 7003 the whole time. A
# diagnosis that fits the theory you brought with you is the one to distrust, which is the same
# lesson P3-1 recorded when three documents agreed with each other and all three were wrong.
#
# Nothing caught either fault before this because `d1-backup.mjs` had only ever been run **by
# hand**, where the operator is `wrangler login`-authenticated against their own account: neither
# the token nor the account id was exercised. That is precisely the gap IMPLEMENTATION-PLAN named
# as the last one open.
#
# **Until that secret exists this workflow fails on its first run, loudly and by design** — a
# scheduled backup that skips itself when unconfigured is the exact failure this file exists to
# prevent. See the `preflight` step.

name: Backup — production D1

on:
  schedule:
    # 17:37 UTC = 01:37 Manila. Off-peak for the users, and offset from the Worker's own 03:00 UTC
    # housekeeping cron so the two never contend. The odd minute is deliberate: GitHub delays
    # scheduled runs that land on the top of the hour, when everyone else's crons fire.
    - cron: '37 17 * * *'
  # So a backup can be taken before anything risky — a migration, a seed, a cutover — without
  # waiting for the schedule or running it from someone's laptop.
  workflow_dispatch:

# Never let two backups of the same database overlap. `cancel-in-progress` is false: a run already
# writing a dump should finish, not be killed halfway by a manual trigger.
concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: Export · verify · retain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Fail with a sentence a human can act on, rather than with wrangler's auth error thirty
      # seconds later. A missing secret is the single most likely reason this job ever goes red.
      - name: Preflight — credentials present
        env:
          # `secrets.NAME` is a **lookup by name**, never a place to paste the value. The name below
          # must match what you called the secret in Settings → Secrets and variables → Actions; the
          # token itself is only ever typed into that page and never appears in this file.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Needed here, not just in the backup step: the D1 reachability probe below asks about
          # this specific account, and that is the question the probe exists to answer.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions. It needs D1:Edit and Account Settings:Read on the account owning CareerLinkAI_Main — Edit, not Read: d1 export and d1 execute are both POSTs that Cloudflare gates behind D1:Edit."
            exit 1
          fi

          # ── Ask Cloudflare whether the token is even valid, before wrangler does ──────────────
          #
          # Added after a run failed with `Authentication error [code: 10000]` against a token whose
          # permissions were, by inspection, correct. **10000 is not a permission error** — a
          # permission shortfall is 9109 / "Unauthorized to access requested resource". 10000 means
          # the token was not accepted at all, which is a different problem with a different fix,
          # and no amount of re-reading the permission list in the dashboard can distinguish them.
          #
          # `/user/tokens/verify` answers exactly that question and nothing else: valid/active, or
          # not. It needs no permissions of its own. So the run can now say "the token is invalid"
          # or "the token is valid, so this is scope" instead of asserting one and hoping.
          #
          # Nothing here prints the token. Its length and a whitespace check are reported because
          # **the single most common cause of a 10000 on a correct token is a copy-paste artefact**
          # — a trailing newline or space inside the secret value, which is invisible in the GitHub
          # UI and changes the bearer string. A Cloudflare API token is 40 characters.
          LEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | wc -c)
          TRIMMED=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | wc -c)

          # Length is reported, never asserted. The first token to pass this check was **53**
          # characters and verified as valid and active, so the familiar "40" is not a rule and a
          # hard check on it would have rejected a working credential. Only the whitespace
          # comparison below is a real test.
          echo "token length: $LEN"
          if [ "$LEN" -ne "$TRIMMED" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains whitespace ($LEN characters, $TRIMMED without). A trailing newline or space is invisible in the GitHub secrets UI and is the most common cause of 'Authentication error [code: 10000]' on a token whose permissions are correct. Re-paste the secret with no trailing newline."
            exit 1
          fi

          VERIFY=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          echo "token verify: $VERIFY"

          # ── `"success":true` is not the same as "usable", and this check learned that the hard way ──
          #
          # A token with a **start date in the future** verifies as `"success":true` with
          # `"status":"active"`, and carries the refusal in a *message*:
          #
          #   "code":10002,"message":"This API Token can not be used before 2026-08-01 00:00:00+00"
          #
          # The first version of this check grepped for `"success":true` and passed it. The run then
          # spent two more probes and an error telling the operator to fix Account Resources that
          # were never wrong — the token was 29 minutes too young. `not_before` and `expires_on` are
          # optional fields set in the dashboard's "Start Date" / "End Date" boxes, and a token
          # created late in the day with today's date is unusable until midnight **UTC**, which is
          # not midnight where it was created.
          #
          # So the window is now checked explicitly rather than inferred from `success`.
          if printf '%s' "$VERIFY" | grep -q '"code":10002'; then
            echo "::error::This token is not usable YET — Cloudflare returned code 10002. It has a start date (not_before) that has not arrived. Nothing is wrong with its permissions or its Account Resources; do not change them. The verify response above gives the exact timestamp, and it is UTC — a token created with today's date becomes usable at 00:00 UTC, which may be hours away in your local timezone. Either wait, or edit the token and clear its Start Date."
            exit 1
          fi

          if printf '%s' "$VERIFY" | grep -qE '"code":(10001|10003)|expired'; then
            echo "::error::This token is expired or revoked (see the response above). Its permissions are not the problem. Issue a new token and update the CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi

          if ! printf '%s' "$VERIFY" | grep -q '"success":true'; then
            echo "::error::Cloudflare does not recognise this token — /user/tokens/verify rejected it, and that endpoint requires no permissions at all. So this is NOT a missing D1:Edit scope: the token value itself is wrong, revoked, expired, or restricted. Check, in this order: (1) it is an API *Token*, not the Global API Key — the Global Key needs CLOUDFLARE_EMAIL + CLOUDFLARE_API_KEY and will never work in this variable; (2) the value was pasted whole and unmodified; (3) the token has not expired (TTL) and is not IP-restricted, since a token limited to your own address cannot be used from a GitHub runner. The response above says which."
            exit 1
          fi

          echo "✓ Cloudflare recognises the token."

          # ── Now the question that actually decides this: can the token reach THIS account's D1? ──
          #
          # A valid token is not the same as an authorised one, and the first run to get this far
          # proved the distinction: /user/tokens/verify said "valid and active" while D1 /query
          # answered `Authentication error [code: 10000]` on the same token, in the same second.
          # So "the token works" and "the token works here" are separate facts and both need asking.
          #
          # Listing databases needs only D1:Read on the account, so it separates the two remaining
          # causes cleanly:
          #   · fails  → the token cannot see this account's D1 at all. Almost always **Account
          #              Resources** on the token, not the permission: a token can carry D1:Edit and
          #              still be scoped to include no account, or the wrong one. That is invisible
          #              in the permission list everyone re-reads.
          #   · passes → D1 is reachable for reads and the export is the first thing refused, which
          #              is the D1:Edit-vs-Read distinction the header describes.
          #
          # Note the codes: 10000 means "valid and active" in the *verify* response and
          # "Authentication error" in the D1 one. The number is not a diagnosis on its own.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is not set, so the D1 reachability probe is skipped. wrangler may still resolve a single-account token on its own."
          else
            # **The body, not just the status.** The first version of this probe captured
            # `%{http_code}` and discarded the response — repeating, inside the diagnostic written
            # to stop it, the exact mistake the diagnostic exists to stop: reporting that something
            # failed while throwing away the sentence saying why. Cloudflare's body distinguishes
            # "Invalid API Token" from "Unauthorized" from "Actor does not have permission", and
            # those are three different fixes.
            D1_BODY=$(curl -s -w '\n%{http_code}' -X GET \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            D1=$(printf '%s' "$D1_BODY" | tail -n1)

            echo "D1 list-databases on this account: HTTP $D1"
            echo "response: $(printf '%s' "$D1_BODY" | sed '$d')"

            if [ "$D1" != "200" ]; then
              # Which accounts can this token actually see? This is the question that separates
              # "the token lacks D1" from "the token is fine but CLOUDFLARE_ACCOUNT_ID names an
              # account it was never scoped to" — and no amount of editing permissions fixes the
              # second one. Account ids are identifiers, not credentials; the configured one is a
              # secret only because it was stored as one, so it prints masked and a mismatch shows
              # up as a visible id next to a `***`.
              echo "--- accounts this token can reach ---"
              curl -s -X GET "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                | tr ',' '\n' | grep -iE '"id"|"name"|"success"|"message"' | head -20
              echo "--- configured CLOUDFLARE_ACCOUNT_ID (masked if it is the secret) ---"
              echo "$CLOUDFLARE_ACCOUNT_ID"

              echo "::error::The token is valid but cannot read D1 on this account (HTTP $D1). Listing databases needs only D1:Read, so this is NOT the D1:Edit-vs-Read distinction. Read the response and the account list above before changing any permission: if the account list is empty or does not contain the configured id, the token is scoped to a different account (or the id is wrong) and no permission edit will help; if the list DOES contain it, the D1 permission is not attached the way it looks — it must be an **Account** permission (Account · D1 · Edit), not a User or Zone one. Note that Cloudflare can take a minute to propagate a token edit."
              exit 1
            fi

            echo "✓ The token can read D1 on this account. Any failure after this is the export itself — see the header on D1:Edit."
          fi

      - name: Back up and verify CareerLinkAI_Main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--no-prune`, not `--keep-days 0`: this runner is thrown away after every run, so the
        # retention policy is the artifact's (below) and there is never a second file here to
        # sweep. `--keep-days 0` would also work — the `--keep-min` floor of 7 saves the only file
        # present — but it reads as "keep nothing" and would become wrong the moment that floor
        # moved. The flag that means "keep everything" should be the one that says so.
        #
        # **Three attempts, because `wrangler d1 export` is genuinely flaky.** Observed while
        # building this workflow: the identical command failed once, hung once, then succeeded
        # twice in a row against the same unchanged database. The export is an asynchronous
        # Cloudflare job (create → poll → download from R2), so a transient API failure is a normal
        # outcome, not a signal about the data.
        #
        # A nightly job that pages on that is a job whose red ticks get ignored — which costs more
        # than the backup it was protecting. The retry is deliberately *not* unbounded and the
        # attempts are spaced.
        #
        # ── But it only retries what is actually worth retrying ──────────────────────────────────
        #
        # The first version retried everything three times and then reported "check the verification
        # output above for which table disagreed" whatever had happened. On the first real run that
        # sentence was simply false: the token lacked D1:Edit, the script died on its *first* remote
        # query, no dump was ever written, and the run spent 60 s of sleep to print a diagnosis of a
        # step it had never reached. A retry loop that reports a cause it did not check is the same
        # defect class as a backup nobody verified — which is the thing this whole job exists to
        # prevent, so it should not be committing it.
        #
        # Two permanent failures are now identified and bail immediately:
        #
        #   · **A rejected dump.** `d1-backup.mjs` writes `<name>.sql.REJECTED` only after the
        #     export succeeded and the row-by-row comparison failed. That is a real disagreement
        #     with the live database and it will disagree identically three times.
        #   · **A credential rejection.** Matched on Cloudflare's own error text, which is a
        #     heuristic and is treated as one: a missed pattern degrades to today's behaviour (three
        #     attempts, still red), so the failure mode of this check is the status quo rather than
        #     a lost backup.
        #
        # Everything else is still assumed transient and still retried — that is the export flake
        # the loop was built for, and it stays.
        run: |
          set -o pipefail
          mkdir -p ./.backups

          for attempt in 1 2 3; do
            echo "::group::Backup attempt $attempt of 3"
            # Tee'd into the artifact directory, not just the console: when the script dies before
            # writing a dump, `if-no-files-found: error` used to upload *nothing at all*, leaving a
            # red tick and no evidence — which is how the first failure took a log-diving session to
            # explain. A failed run must always leave something behind. Pruning cannot touch these:
            # the script only sweeps files matching its own `<db>-<env>-` prefix.
            if node scripts/d1-backup.mjs --env production --out ./.backups --no-prune 2>&1 \
                | tee "./.backups/attempt-$attempt.log"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"

            if ls ./.backups/*.REJECTED >/dev/null 2>&1; then
              echo "::error::Verification failed — the dump did not match the live database, so it was rejected rather than kept. This is not transient and retrying cannot change it. The .REJECTED dump and the log are in the artifact; the FAIL lines above name which table disagreed. The last good backup is still the last good backup."
              exit 1
            fi

            if grep -qiE 'code: 7003|could not route to|object identifier is invalid' "./.backups/attempt-$attempt.log"; then
              echo "::error::Cloudflare could not route the request [code: 7003] — an identifier in the URL is wrong, and retrying cannot change it. This is almost always CLOUDFLARE_ACCOUNT_ID: the database_id comes from wrangler.toml and is in the log unmasked, but the account id is a secret and prints as ***, so compare it against \`wrangler whoami\` rather than reading it here. Note that a WRONG account id is worse than none at all — with the secret unset, a single-account token resolves its own."
              exit 1
            fi

            if grep -qiE 'code: (10000|10001|9109|9106)|authentication error|unable to authenticate|you do not have permission|not authorized|unauthorized' "./.backups/attempt-$attempt.log"; then
              echo "::error::Cloudflare rejected the credentials [code: 10000] — this is the token, not the data, and retrying cannot change it. CLOUDFLARE_API_TOKEN needs D1:Edit (not D1:Read) and Account Settings:Read on the account owning CareerLinkAI_Main. See the header of this workflow for why Edit and not Read."
              exit 1
            fi

            echo "::warning::Backup attempt $attempt failed, with no dump produced and no permanent cause identified — treating it as a transient export error and retrying."
            [ "$attempt" -lt 3 ] && sleep 30
          done

          echo "::error::All 3 backup attempts failed and none looked permanent, so all three were genuinely retried. The export is an asynchronous Cloudflare job and three spaced failures is beyond normal flakiness — check the per-attempt logs in the artifact for what the script was doing when it died."
          exit 1

      # `if: always()` so a *failed* verification still uploads what it produced. A `.REJECTED` dump
      # is the most diagnostic artifact this job can emit and throwing it away leaves only a red
      # tick and no evidence of which table disagreed.
      #
      # `if-no-files-found: error` was, until the per-attempt logs above existed, a second red step
      # on every failure that happened *before* an export — reporting "no files were found", which
      # is true and useless, on top of a backup error that had already misdiagnosed itself. It is
      # kept rather than softened, because it is now a real assertion: a run that reaches this step
      # having written neither a dump nor a log did something this file does not model.
      - name: Upload dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-production-${{ github.run_id }}
          path: backend/.backups/*
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production D1 backup"
            echo ""
            for f in ./.backups/*; do
              [ -e "$f" ] || continue
              printf -- "- \`%s\` — %s\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
