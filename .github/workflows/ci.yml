# CI (FULLPLAN §47) — the gate that was deviation D9, open from Step 1 to Step 5.
#
# It runs with **no Cloudflare credentials at all**, and that is not an accident: the backend suite
# executes against `wrangler.test.toml`, which is wrangler.toml minus the `[ai]` and `[[vectorize]]`
# bindings. Those two have no local emulation and always dial out to the Cloudflare API, so with the
# real config every test worker performed a network handshake before running a single assertion —
# and an expired `wrangler login` once took the whole suite from green to "no tests". A suite that
# cannot run offline is not a contract; it is a service with an uptime dependency. Miniflare
# emulates D1, KV, R2 and Queues in-process, so everything the tests actually touch is local.
#
# What this gate does NOT and CANNOT check — read this before trusting a green tick:
# Miniflare is not Cloudflare. It enforces neither the runtime's 100,000-iteration PBKDF2 ceiling
# nor any CPU limit, and Step 5 shipped a Worker that was green here 371 times and could not verify
# a single staff password on the edge. `test/unit/crypto.test.ts` now asserts on what the code
# *asks of the platform* rather than on what the local runtime hands back, which is the only shape
# of test that can catch that class of bug from here. Deploy-time verification is still the real
# check — see `scripts/walkthrough.mjs`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push while CI is mid-run should cancel the stale run, not race it to the status check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — type-check · lint · platform gates · tests (workerd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Phase 4.5 Step 2 — the Miniflare-blind limits, asserted statically: no [limits] block
      # (Free rejects it, code 100328), every environment carries the full binding set including
      # AUTH_DO, and deriveBits is called nowhere outside the Durable Object.
      #
      # Plus the single-Worker routing invariants: every profile that serves the SPA must also
      # list `run_worker_first = ["/api/*"]`, because `not_found_handling` is evaluated before the
      # Worker and would otherwise answer /api/v1/health with the HTML shell — a failure the app
      # itself never shows, since a loaded page's `fetch()` keeps working.
      - name: Platform gates (config shape, asset routing, DO boundary)
        run: npm run gate:platform

      # The gzipped Worker must stay under 2.5 MB against the Free plan's 3 MB cap. This is a
      # dry-run build — it needs no Cloudflare credentials. Static assets are stored separately by
      # the platform and count against no bundle limit, so this still measures only the script;
      # the script's `[build]` hook is skipped here (this job installs backend deps only).
      - name: Platform gate (bundle size)
        run: npm run gate:bundle

      # The suite runs in workerd via @cloudflare/vitest-pool-workers. It is slow because §38's
      # PBKDF2 is *supposed* to be slow — the lockout test alone pays six honest derivations at
      # the full 600,000 iterations — so do not "fix" a timeout here by weakening the hash. The
      # budget is the thing that is wrong.
      - name: Test
        run: npm test

  frontend:
    name: Frontend — type-check · tests · build · asset weight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      # `extractText.test.ts` runs in real Chrome (the `browser` project in vite.config.ts), so the
      # runner needs one. `ubuntu-latest` ships Google Chrome, which is what `channel: 'chrome'`
      # asks for — the same choice scripts/csp-check.mjs makes, and the reason nothing is
      # downloaded here. Playwright still needs its own shared libraries, and `--only-shell` is
      # deliberately not used: it installs headless shell *instead of* a browser, and this project
      # drives the real one.
      #
      # This step is the reason the CI file changed at all. Everything else about `npm test` is
      # unchanged; it now runs two projects instead of one.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      # `test:capture`, not `test` — same suite, same reporters on stdout, plus a machine-readable
      # report. CI is two cores and always cold (see vite.config.ts on why `testTimeout` was raised
      # to 15 s), which makes it *likelier* than a developer machine to lose a timing-sensitive
      # assertion. When that happens the log scrolls past and ages out; this leaves something a
      # human can open and something a script can diff.
      - name: Test
        run: npm run test:capture

      # `if: always()` is the whole point — an artifact uploaded only on success documents exactly
      # the runs nobody needs it for.
      #
      # ⚠️ `test-results/` and `.vitest-attachments/` differ by one character that matters:
      # upload-artifact@v4 **skips dot-directories** (`include-hidden-files` defaults to false), so
      # the attachments path needs the flag and the report path deliberately does not start with a
      # dot. That default is the P3-10 fault verbatim — `.backups` was never uploaded, and "no files
      # were found" read as a symptom of a different bug for five runs.
      #
      # Screenshots matter here specifically because `extractText.test.ts` runs in real Chrome: a
      # failure there writes a picture of the page at the moment it broke, which is the one piece of
      # evidence that cannot be reconstructed after the runner is torn down.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: |
            frontend/test-results/
            frontend/.vitest-attachments/
            frontend/src/**/__screenshots__/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # The build is part of the gate, not a deploy step: `tsc --noEmit` passing does not prove Vite
      # can actually bundle the thing, and the first place that would surface is a deploy — which,
      # since the consolidation, is the *same* deploy that ships the API. A frontend that cannot
      # build now blocks the backend from shipping too, so proving it here matters more than before.
      - name: Build
        run: npm run build

      # `dist/_headers` is what grants the year-long immutable caching on hashed chunks, and it
      # arrives there only because Vite copies `public/` verbatim. Nothing else would notice its
      # absence: the site works perfectly, just slower on every repeat visit, forever.
      - name: Assert the asset cache policy shipped
        run: test -f dist/_headers && grep -q immutable dist/_headers

      # Plan P1-3 — the guard audit finding P1 shipped without.
      #
      # A 3.26 MB master PNG was the login screen's logo for the life of the project and CI never
      # said a word, because the only size CI measured was `gate:bundle` — and that weighs the
      # **Worker script**. Cloudflare stores static assets separately, against no bundle limit, so
      # the one number reported was the one number the defect could not move. Nothing today would
      # stop someone re-importing a master asset and silently restoring a 4 MB login screen.
      #
      # It lives in this job rather than the backend one because it needs a real `dist/`: the
      # backend job installs backend dependencies only and its `gate:bundle` deliberately skips
      # the Vite build. Weighing the empty `dist/` that job creates would report a comfortable
      # pass on nothing at all.
      #
      # Plan P3-3 adds the route-weight half to the same command. A per-file budget cannot see
      # audit P2 at all: 929 KiB of route code split into seven chunks every visitor downloads
      # anyway would pass every budget above while costing exactly what it cost before. The route
      # gate reads Vite's manifest and weighs each group's *closure* — and, more importantly,
      # asserts the split is still a split. One stray static import of a group barrel folds it back
      # into the entry chunk with a green build, a green type-check and 177 green frontend tests.
      - name: Asset weight gate (media budget, chunk ratchet, route weight)
        run: npm run gate:assets
